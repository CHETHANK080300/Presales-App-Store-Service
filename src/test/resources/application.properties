spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

app.upload.base-path=target/uploads
app.download.base-url=http://localhost:8093
app.download.context-path=/downloads
jwt.secret=ChangeThisSecretKey123456789012345678901234
jwt.expiration=300
jwt.refreshExpiration=3600
auth.max.failed.attempts=3
