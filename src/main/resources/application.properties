##############################################
# Application Configuration
##############################################

# Server Config
server.port=8093
spring.application.name=Presales-App-Store-Service

logging.level.root=INFO
logging.level.com.iexceed.appzillon=DEBUG

# Auth and JWT
jwt.secret=ChangeThisSecretKey123456789012345678901234
jwt.expiration=300
jwt.refreshExpiration=3600
auth.max.failed.attempts=3

# Datasource (use provided MySQL credentials)
spring.datasource.url=jdbc:mysql://localhost:3306/APPSTORE
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# For production DB, keep ddl-auto=none (run schema scripts manually)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Base Upload Path
app.upload.base-path=/home/fileUploadPath/
app.download.base-url=http://localhost:8093
app.download.context-path=/downloads